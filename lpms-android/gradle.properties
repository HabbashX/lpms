org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- Base URLs. The API prefix /api/v1 is appended in code (see BuildConfig). ----
# Emulator loopback to a backend running on the host machine.
lpms.dev.baseUrl=http://10.0.2.2:8080/
# Production HTTPS host. Override locally; do NOT commit a trailing-space variant.
lpms.prod.baseUrl=https://lpms-api.onrender.com/

# Local-only flag: enables the "server URL" field on the login screen.
lpms.allowServerUrlOverride=true