spring:
  # All sensitive values are mandatory environment variables; the application
  # fails fast at startup when any of them is missing.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION:3600}
  bootstrap:
    admin-username: ${ADMIN_USERNAME}
    admin-initial-password: ${ADMIN_INITIAL_PASSWORD}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    com.larv.pharmacy: INFO
    org.springframework.security: WARN
