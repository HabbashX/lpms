spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lpms_test?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET:integration-test-secret-0123456789abcdef0123456789abcdef}
    expiration-seconds: ${JWT_EXPIRATION:3600}
  bootstrap:
    admin-username: ${ADMIN_USERNAME:admin}
    # Must satisfy PasswordPolicy (8-72 chars, letter + digit, must not contain the username).
    admin-initial-password: ${ADMIN_INITIAL_PASSWORD:Lpms#Test2026}

logging:
  level:
    com.larv.pharmacy: INFO
    org.hibernate.SQL: WARN
